services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: actuary
      POSTGRES_PASSWORD: actuary
      POSTGRES_DB: claims
    ports:
      - "55432:5432"
    volumes:
      # 首次启动按文件名顺序执行：schema -> 种子数据 -> SQL 补录示例
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actuary -d claims"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://actuary:actuary@db:5432/claims
      MAX_SESSIONS: "2"
      SESSION_TTL_SECONDS: "60"
      PAGE_SIZE_CAP: "100"
      # 关闭/到期后等待在途 SQL 响应 cancel 的宽限；超时强制中断该连接
      CANCEL_GRACE_SECONDS: "1.0"
      CLOSE_WAIT_TIMEOUT_SECONDS: "10"
      # 开启后可用 X-Debug-SQL-Sleep-Seconds / X-Debug-Pre-Sleep-Seconds 演示
      ENABLE_DEBUG_HOOKS: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
